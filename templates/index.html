<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevOps Flask App</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .status {
            text-align: center;
            background: #e8f7ee;
            color: #16803c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .card {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fafafa;
        }

        .card h3 {
            margin-bottom: 8px;
        }

        .card p {
            color: #666;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🚀 DevOps Flask App</h1>

        <p class="subtitle">
            Containerized Flask Application
        </p>

        <div class="status">
            ✅ Application is Running
        </div>

        <div class="cards">

            <div class="card">
                <h3>🐳 Docker</h3>
                <p>Application containerized using Docker.</p>
            </div>

            <div class="card">
                <h3>🔄 CI/CD</h3>
                <p>Automated using GitHub Actions.</p>
            </div>

            <div class="card">
                <h3>📦 Docker Hub</h3>
                <p>Docker image published to Docker Hub.</p>
            </div>

            <div class="card">
                <h3>⚙️ Flask</h3>
                <p>Lightweight Python web application.</p>
            </div>

        </div>

        <div class="footer">
            DevOps Learning Project
        </div>

    </div>

</body>
</html>
